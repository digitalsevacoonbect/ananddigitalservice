<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Seva Connect - Admin Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        h1, h2 {
            color: #075eab;
        }

        input, button, select {
            padding: 12px;
            margin: 6px 0;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
        }

        button {
            background: #075eab;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout {
            background: #b42318;
        }

        .hidden {
            display: none;
        }

        #message {
            margin: 12px 0;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .application {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            overflow-wrap: anywhere;
        }

        .application select {
            max-width: 100%;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Digital Seva Connect</h1>
    <h2>Admin Panel 🔐</h2>

    <div id="loginBox">
        <h3>Admin Login</h3>

        <form id="loginForm">
            <label for="password">Admin Password</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >
            <button type="submit">Login करें</button>
        </form>
    </div>

    <div id="dashboard" class="hidden">
        <h2>सभी आवेदन</h2>

        <button type="button" id="refreshButton">
            आवेदन Refresh करें
        </button>

        <button type="button" id="logoutButton" class="logout">
            Logout
        </button>

        <div id="applications"></div>
    </div>

    <div id="message" role="status"></div>
</div>

<script>
const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const applicationsBox = document.getElementById("applications");

document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    message.textContent = "Login हो रहा है...";

    try {
        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login नहीं हुआ।");
        }

        loginBox.classList.add("hidden");
        dashboard.classList.remove("hidden");
        document.getElementById("password").value = "";
        message.textContent = "Login सफल हुआ।";

        await loadApplications();
    } catch (error) {
        message.textContent = error.message;
    }
});

async function loadApplications() {
    message.textContent = "आवेदन लोड हो रहे हैं...";
    applicationsBox.replaceChildren();

    try {
        const response = await fetch("/api/admin/applications");

        if (response.status === 401) {
            dashboard.classList.add("hidden");
            loginBox.classList.remove("hidden");
            throw new Error("कृपया दोबारा Login करें।");
        }

        if (!response.ok) {
            throw new Error("आवेदन लोड नहीं हुए।");
        }

        const applications = await response.json();

        if (applications.length === 0) {
            message.textContent = "अभी कोई आवेदन नहीं है।";
            return;
        }

        for (const item of applications) {
            const card = document.createElement("div");
            card.className = "application";

            const heading = document.createElement("h3");
            heading.textContent = item.applicationNumber;
            card.appendChild(heading);

            const fields = [
                ["नाम", item.name],
                ["मोबाइल", item.mobile],
                ["सेवा", item.service],
                ["जानकारी", item.details || "नहीं दी गई"],
                ["तारीख", item.createdAt],
                ["वर्तमान स्टेटस", item.status]
            ];

            for (const [label, value] of fields) {
                const p = document.createElement("p");
                p.textContent = label + ": " + value;
                card.appendChild(p);
            }

            const label = document.createElement("label");
            label.textContent = "स्टेटस बदलें: ";

            const select = document.createElement("select");

            for (const status of [
                "Pending",
                "Processing",
                "Completed",
                "Rejected"
            ]) {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                if (status === item.status) {
                    option.selected = true;
                }
                select.appendChild(option);
            }

            label.appendChild(select);
            card.appendChild(label);

            const updateButton = document.createElement("button");
            updateButton.textContent = "स्टेटस अपडेट करें";

            updateButton.addEventListener("click", async () => {
                updateButton.disabled = true;

                try {
                    const updateResponse = await fetch(
                        "/api/admin/applications/" +
                        encodeURIComponent(item.id) +
                        "/status",
                        {
                            method: "PATCH",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                status: select.value
                            })
                        }
                    );

                    const result = await updateResponse.json();

                    if (!updateResponse.ok) {
                        throw new Error(result.message || "अपडेट नहीं हुआ।");
                    }

                    message.textContent = "स्टेटस अपडेट हो गया।";
                    await loadApplications();
                } catch (error) {
                    message.textContent = error.message;
                } finally {
                    updateButton.disabled = false;
                }
            });

            card.appendChild(updateButton);
            applicationsBox.appendChild(card);
        }

        message.textContent = "कुल आवेदन: " + applications.length;

    } catch (error) {
        message.textContent = error.message;
    }
}

document.getElementById("refreshButton").addEventListener("click", loadApplications);

document.getElementById("logoutButton").addEventListener("click", async () => {
    try {
        await fetch("/api/admin/logout", { method: "POST" });
    } finally {
        dashboard.classList.add("hidden");
        loginBox.classList.remove("hidden");
        applicationsBox.replaceChildren();
        message.textContent = "आप Logout हो गए हैं।";
    }
});
</script>

</body>
</html>
